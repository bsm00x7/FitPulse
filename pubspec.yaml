name: fitness
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.0
  provider: ^6.1.5
  carousel_slider: ^5.1.1
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  percent_indicator: ^4.2.5
  fl_chart: ^1.0.0
  simple_animation_progress_bar: ^1.9.2
  dashed_circular_progress_bar: ^0.0.6
  cloud_firestore: ^5.6.12
  intl: ^0.20.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/home/
    - assets/button_navigation/
    - assets/complete/
    - assets/goal/
    - assets/login/
    - assets/onboarding_image/
    - assets/signup/
    - assets/notification_image/
    - assets/profile/
    - assets/activity/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
