name: fitness
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.0
  provider: ^6.1.5
  carousel_slider: ^5.1.1
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  percent_indicator: ^4.2.5
  fl_chart: ^1.0.0
  simple_animation_progress_bar: ^1.9.2
  dashed_circular_progress_bar: ^0.0.6
  cloud_firestore: ^5.6.12
  intl: ^0.20.2
  lottie: ^3.3.1
  simple_circular_progress_bar: ^1.0.2
  uuid: ^4.5.1
  font_awesome_flutter: ^10.8.0
  http: ^1.4.0
  cached_network_image: ^3.4.1
  permission_handler: ^12.0.1
  pedometer: ^4.1.1
  gif: ^2.3.0
  health: ^13.1.1
  image_picker: ^1.1.2
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/home/
    - assets/button_navigation/
    - assets/complete/
    - assets/goal/
    - assets/login/
    - assets/onboarding_image/
    - assets/signup/
    - assets/notification_image/
    - assets/profile/
    - assets/activity/
    - assets/lottis_json/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
