name: fitness
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.0
  provider: ^6.1.5
  modal_bottom_sheet: ^3.0.0
  awesome_snackbar_content: ^0.1.7
  carousel_slider: ^5.1.1
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/onboarding_image/
    - lib/assets/login/
    - lib/assets/signup/
    - lib/assets/complete/
    - lib/assets/goal/
    - lib/assets/button_navigation/

  fonts:
    - family: Poppins
      fonts:
        - asset: lib/assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Poppins-Bold.ttf
          weight: 700
